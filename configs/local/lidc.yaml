# LIDC local configuration

data:
  image_size: 256  # Size of input images [64 | 128 | 256]
  path: "{LIDC_DATA_ROOT}"  # Root directory containing LIDC-IDRI-* volumes
  train_list: "lidc_data/train.txt"
  val_list: "lidc_data/val.txt"
  task: "lidc"       # Public task alias used by the dataset factory
  num_workers: 4     # Number of data loading workers
  val_frac: 0.1      # Validation split ratio used when generating train.txt and val.txt
  augment: False
  normalize: True

model:
  name: "PRDiT-B/16/0-s16"  # 256^3 stage-1: stride-16 tiling -> 16^3=4096 tokens (see models/__init__.py)
  num_classes: 1      # Number of classes for conditional generation
  in_channels: 1      # Number of input channels
  out_channels: 1     # Velocity head: out_channels == in_channels (Flow Matching)
  num_sampling_steps: 100  # Euler ODE steps used for generative evaluation
  pretrained_path: ""
  checkpoint: ""
  flash_attn: True
  grad_checkpoint: False   # Stage-1 has no transformer branch; no effect at depth=0

training:
  batch_size: 16           # Per-optimiser-step global batch (stage-1 MLP denoiser is light)
  grad_accum_steps: 2      # Accumulate 2 micro-batches -> effective batch size 32
  amp: True                # bfloat16 autocast for the whole forward pass
  learning_rate: 1e-4      # Learning rate for AdamW optimizer
  total_steps: 104000      # Total optimiser updates (replaces epochs — dataset-size-agnostic)
  seed: 42                 # Random seed for reproducibility
  weight_decay: 0.0        # Weight decay for optimizer
  gradient_clip: 1.0

output:
  results_dir: "results_lidc"         # Directory for saving results
  checkpoint_dir: "checkpoints"  # Directory for saving model checkpoints

logging:
  log_every: 400    # Log metrics every N steps
  ckpt_every: 1000  # Save checkpoint every N steps
  eval_every: 1000  # Evaluate model every N epochs

wandb:
  project: "{WANDB_PROJECT}"
  entity: "{WANDB_ENTITY}"
  tags: "lidc"
  enable: False  # Set True after replacing the W&B placeholders above

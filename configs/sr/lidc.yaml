# LIDC stage-3a configuration: super-resolution refinement, frozen base
# (Stage 3a — train a lightweight local-MLP SR head at the target resolution
# on top of a frozen, already-trained stage-1+2 PRDiT checkpoint.)

data:
  image_size: 256        # SR target resolution
  base_image_size: 128   # Resolution the frozen base model operates at
  path: ""  # Root directory containing lidc_preprocessed/
  train_list: "lidc_data/train.txt"
  val_list: "lidc_data/val.txt"
  task: "lidc"       # Public task alias used by the dataset factory
  num_workers: 4     # Number of data loading workers
  val_frac: 0.1      # Validation split ratio used when generating train.txt and val.txt
  augment: False
  normalize: True

model:
  name: "PRDiT-SR-B/12/4"  # Stage-3 registry name (bookkeeping only, read by util.Args/setup_wandb)
  num_classes: 1
  out_channels: 2   # PRDiTSR always predicts (eps, img); needed by diffusion.loading_diffusion

base_model:
  name: "PRDiT-B/12/4"     # Must match the stage-2 checkpoint's architecture
  in_channels: 1
  out_channels: 2
  checkpoint: ""    # Set to /path/to/stage2/checkpoint.pt before training
  finetune: False   # Stage-3a: base frozen, only the SR head is trained

sr_model:
  hidden_size: 768
  patch_size: 12
  stride: 8
  padding: 2
  resume_checkpoint: ""   # Only used when resuming a stage-3a run itself

training:
  batch_size: 8
  learning_rate: 9e-5      # SR head learning rate
  fine_tune_lr: 6e-6       # Unused while base_model.finetune is False; read by stage-3b
  total_steps: 60000
  epochs: 1
  seed: 42
  weight_decay: 0.0
  gradient_clip: 1.0

output:
  results_dir: "results_sr"
  checkpoint_dir: "checkpoints"

logging:
  log_every: 100
  ckpt_every: 1000
  eval_every: 1000

wandb:
  project: ""    # Optional W&B project name; keep empty in public templates
  entity: ""     # Optional W&B entity/username
  tags: ""
  enable: False

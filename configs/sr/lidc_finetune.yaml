# LIDC stage-3 configuration: super-resolution refinement, joint fine-tune
# (Stage 3b — continue from stage 3a's best checkpoint, unfreeze the base
# model, and fine-tune the whole stack at a very low learning rate. This is
# the step that took eval_loss from 0.0019 to 0.0018 in the ported experiment.)

data:
  image_size: 256
  base_image_size: 128
  path: ""  # Root directory containing lidc_preprocessed/
  train_list: "lidc_data/train.txt"
  val_list: "lidc_data/val.txt"
  task: "lidc"
  num_workers: 4
  val_frac: 0.1
  augment: False
  normalize: True

model:
  name: "PRDiT-SR-B/12/4-ft"
  num_classes: 1
  out_channels: 2   # PRDiTSR always predicts (eps, img); needed by diffusion.loading_diffusion

base_model:
  name: "PRDiT-B/12/4"
  in_channels: 1
  out_channels: 2
  checkpoint: "/path/to/stage2/checkpoint.pt"   # still required to construct the base architecture;
                                                 # its weights are overwritten by sr_model.resume_checkpoint below
  finetune: True                                # stage-3b: base unfrozen, jointly fine-tuned

sr_model:
  hidden_size: 768
  patch_size: 12
  stride: 8
  padding: 2
  resume_checkpoint: "results_sr/000-PRDiT-SR-B-12-4/checkpoints/best_0.001900.pt"  # stage-3a's best checkpoint

training:
  batch_size: 8
  learning_rate: 1e-7
  fine_tune_lr: 1e-7
  total_steps: 5000        # short, ultra-low-LR continuation
  epochs: 1
  seed: 42
  weight_decay: 0.0
  gradient_clip: 0.2

output:
  results_dir: "results_sr_ft"
  checkpoint_dir: "checkpoints"

logging:
  log_every: 20
  ckpt_every: 200
  eval_every: 200

wandb:
  project: ""    # Optional W&B project name; keep empty in public templates
  entity: ""     # Optional W&B entity/username
  tags: ""
  enable: False
